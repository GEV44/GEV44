<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Gevorg Hovhannisyan, AI and automation engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a35"/>
      <stop offset="1" stop-color="#1a1240"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
      .edge{stroke:#7c86c9;stroke-opacity:.35;stroke-width:1.4}
      .node{fill:#c7d2fe}
      .pulse{animation:p 3.2s ease-in-out infinite}
      .d1{animation-delay:.4s}.d2{animation-delay:.9s}.d3{animation-delay:1.4s}.d4{animation-delay:1.9s}.d5{animation-delay:2.4s}
      @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
      .flow{stroke-dasharray:6 10;animation:f 6s linear infinite}
      @keyframes f{to{stroke-dashoffset:-160}}
      @media (prefers-reduced-motion:reduce){.pulse,.flow{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="18" fill="url(#glow)"/>

  <!-- retrieval graph decoration -->
  <g transform="translate(790,40)">
    <line class="edge" x1="40" y1="60" x2="150" y2="30"/>
    <line class="edge" x1="40" y1="60" x2="130" y2="120"/>
    <line class="edge" x1="150" y1="30" x2="260" y2="70"/>
    <line class="edge" x1="130" y1="120" x2="260" y2="70"/>
    <line class="edge" x1="130" y1="120" x2="220" y2="170"/>
    <line class="edge" x1="260" y1="70" x2="340" y2="130"/>
    <line class="edge" x1="220" y1="170" x2="340" y2="130"/>
    <path class="flow" d="M40 60 L130 120 L260 70 L340 130" fill="none" stroke="url(#accent)" stroke-width="2.4"/>
    <circle class="node pulse" cx="40" cy="60" r="7"/>
    <circle class="node pulse d1" cx="150" cy="30" r="5"/>
    <circle class="node pulse d2" cx="130" cy="120" r="7"/>
    <circle class="node pulse d3" cx="260" cy="70" r="8"/>
    <circle class="node pulse d4" cx="220" cy="170" r="5"/>
    <circle class="node pulse d5" cx="340" cy="130" r="9" fill="#a78bfa"/>
    <text class="t" x="340" y="160" fill="#c4b5fd" font-size="12" text-anchor="middle">answer + sources</text>
  </g>

  <text class="t" x="64" y="104" fill="#f8fafc" font-size="46" font-weight="700">Gevorg Hovhannisyan</text>
  <rect x="64" y="122" width="96" height="4" rx="2" fill="url(#accent)"/>
  <text class="t" x="64" y="164" fill="#cbd5e1" font-size="22">AI &amp; Automation Engineer · Yerevan, Armenia</text>
  <text class="t" x="64" y="204" fill="#94a3b8" font-size="17">RAG assistants that cite their sources · Telegram bots · LLM pipelines · n8n / Make · FastAPI</text>
  <text class="t" x="64" y="240" fill="#7dd3fc" font-size="15">gev44.github.io   ·   t.me/hovhannisyan77</text>
</svg>
