  <g fill="#c7d2fe" fill-opacity="0.55">
    <circle cx="230" cy="300" r="12"/><circle cx="400" cy="220" r="10"/>
    <circle cx="620" cy="260" r="10"/><circle cx="800" cy="330" r="12"/>
    <circle cx="220" cy="720" r="12"/><circle cx="420" cy="800" r="10"/>
    <circle cx="640" cy="770" r="10"/>
  </g>
  <circle cx="810" cy="690" r="22" fill="#a78bfa"/>
  <circle cx="512" cy="512" r="430" fill="none" stroke="url(#ring)" stroke-width="10" stroke-opacity="0.85"/>
  <text x="512" y="512" dy="0.35em" text-anchor="middle"
